    <style>
      /* Page loader — critical; mirrors global.css until bundle CSS loads */
      .loader {
        position: fixed;
        inset: 0;
        background: #f5f1e6;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s ease;
      }
      .loader-logo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        border-radius: 0;
        box-shadow: none;
        transform: scale(1.03);
        animation: loaderKenBurns 2.6s ease-in-out infinite alternate;
      }

      /* Desktop: fit the whole artwork (no crop) */
      @media (min-width: 900px) {
        .loader-logo {
          object-fit: cover;
          transform: none;
          animation: none;
        }
      }
      @keyframes loaderKenBurns {
        0% {
          transform: scale(1.03);
          filter: saturate(1) contrast(1);
        }
        100% {
          transform: scale(1.08);
          filter: saturate(1.06) contrast(1.02);
        }
      }
      .loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-logo {
          animation: none;
          transform: none;
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="page-loader"
      class="loader"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="טוען"
    >
      <picture>
        <source media="(min-width: 900px)" srcset="/loader/loader-art-desktop.webp" />
        <img
          class="loader-logo"
          src="/loader/loader-art.webp"
          alt="Sachi Ramen &amp; Sushi — טוען"
          width="520"
          height="520"
          fetchpriority="high"
          decoding="async"
          loading="eager"
        />
      </picture>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
